{% extends 'base.html' %}

{% block title %}Add new image for {{ recipe.name }}{% endblock %}

{% block content %}

    <h2>Upload image for {{ recipe.name }}</h2>

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Save image</button>
    </form>

    <hr>

    <div style="display: flex; gap: 10px; align-items: center;">
        <form action="{% url 'ledger:recipes_list' %}">
            <input type="submit" value="Go back to recipe list" />
        </form>
    
        <form method="POST" action="{% url 'logout' %}">
            <button type="submit">Logout</button>
        </form>
    </div>

{% endblock %}
